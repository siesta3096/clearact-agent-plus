[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearact"
version = "0.1.0"
description = "A local-first, inspectable agent runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "httpcore>=1,<2",
  "ddgs>=9,<10",
  "readability-lxml>=0.8,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<14",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
clearact = "clearact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clearact"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
